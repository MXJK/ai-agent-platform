x-app-environment: &app-environment
  RUNTIME_PROFILE: "custom"
  APP_HOST: "0.0.0.0"
  APP_PORT: "8000"
  APP_RELOAD: "0"
  DATABASE_URL: "postgresql://${POSTGRES_USER:-ai_agent}:${POSTGRES_PASSWORD:-local-only-change-me}@postgres:5432/${POSTGRES_DB:-ai_agent_platform}"
  QDRANT_URL: "http://qdrant:6333"
  SESSION_REPOSITORY: "postgres"
  AGENT_RUN_STORE: "postgres"
  CHANGE_SET_STORE: "postgres"
  DOCUMENT_STORE: "postgres"
  WORKSPACE_STORE: "postgres"
  LANGGRAPH_CHECKPOINTER: "postgres"
  MODEL_REGISTRY_STORE: "postgres"
  MODEL_SECRET_BACKEND: "encrypted_file"
  RAG_VECTOR_STORE: "qdrant"
  PROJECT_MEMORY_STORE: "postgres"
  PROJECT_MEMORY_VECTOR_STORE: "qdrant"
  PROJECT_MEMORY_ENABLED: "true"
  PROJECT_MEMORY_MODE: "auto"
  USER_MEMORY_ENABLED: "true"
  USER_MEMORY_MODE: "auto"
  TASK_QUEUE_BACKEND: "in_process"
  AUTH_MODE: "single_user"
  SINGLE_USER_ID: "${SINGLE_USER_ID:-owner}"
  NATIVE_DIRECTORY_PICKER_MODE: "disabled"
  WORKSPACE_ALLOWED_ROOTS: "/workspaces"
  LOCAL_STATE_PATH: "/var/lib/ai-agent-platform/state.sqlite3"
  LIVE_WORKSPACE_WRITES_ENABLED: "true"
  AGENT_WORKSPACE_DEFAULT_MODE: "direct"
  AGENT_WORKSPACE_ALLOWED_MODES: "direct"
  AGENT_TOOL_RESULT_MAX_TOKENS: "${AGENT_TOOL_RESULT_MAX_TOKENS:-2000}"
  AGENT_TOOL_RESULT_KEEP_RECENT: "${AGENT_TOOL_RESULT_KEEP_RECENT:-6}"
  AGENT_NATIVE_MAX_COMPACTIONS: "${AGENT_NATIVE_MAX_COMPACTIONS:-3}"
  CHANGE_SET_APPLY_MODE: "patch_only"
  CHANGE_SET_WORKTREE_PARENT: "/var/lib/ai-agent-platform/worktrees"
  SANDBOX_MODE: "local"
  SANDBOX_WORKSPACE_PARENT: "/var/lib/ai-agent-platform/sandboxes"
  MCP_ENABLED: "true"
  MCP_CONFIG_PATH: "/home/app/.ai-agent-platform/mcp.json"
  SKILLS_ENABLED: "true"
  SKILLS_DIRECTORY_PATH: "/home/app/.ai-agent-platform/skills"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-ai_agent_platform}"
      POSTGRES_USER: "${POSTGRES_USER:-ai_agent}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local-only-change-me}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.16.1
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment: *app-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment: *app-environment
    ports:
      - "127.0.0.1:${SELF_HOSTED_PORT:-8000}:8000"
    volumes:
      - "${WORKSPACE_HOST_PATH:-./workspaces}:/workspaces"
      - "${HOME}/.ai-agent-platform:/home/app/.ai-agent-platform"
      - app_state:/var/lib/ai-agent-platform
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  app_state:
  postgres_data:
  qdrant_data:

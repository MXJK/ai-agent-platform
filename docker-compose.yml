services:
  # FastAPI runs on the host and reads AGENT_WORKSPACE_DEFAULT_MODE and
  # AGENT_WORKSPACE_ALLOWED_MODES from .env. Compose owns the gateway trust
  # boundary only; its safe default remains unauthenticated/loopback.
  gateway:
    profiles: ["gateway"]
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      GATEWAY_LISTEN_ADDRESS: ":8080"
      GATEWAY_UPSTREAM_URL: "http://host.docker.internal:${APP_PORT:-8001}"
      GATEWAY_MAX_CONCURRENT_REQUESTS: "256"
      GATEWAY_REQUESTS_PER_SECOND: "0"
      GATEWAY_AUTH_MODE: "${GATEWAY_AUTH_MODE:-disabled}"
      GATEWAY_LOCAL_USER_ID: "${GATEWAY_LOCAL_USER_ID:-demo_user}"
      GATEWAY_OIDC_ISSUER: "${GATEWAY_OIDC_ISSUER:-}"
      GATEWAY_OIDC_AUDIENCE: "${GATEWAY_OIDC_AUDIENCE:-}"
      GATEWAY_OIDC_JWKS_URL: "${GATEWAY_OIDC_JWKS_URL:-}"
      GATEWAY_OIDC_JWKS_CACHE_TTL: "${GATEWAY_OIDC_JWKS_CACHE_TTL:-5m}"
      GATEWAY_TRUST_SECRET: "${GATEWAY_TRUST_SECRET:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8000:8080"
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  postgres:
    profiles: ["production"]
    image: postgres:16
    container_name: ai-agent-platform-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-ai_agent_platform}"
      POSTGRES_USER: "${POSTGRES_USER:-ai_agent}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  adminer:
    profiles: ["production"]
    image: adminer:5.5.0-standalone
    container_name: ai-agent-platform-adminer
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    restart: unless-stopped

  qdrant:
    profiles: ["production"]
    image: qdrant/qdrant:v1.16.1
    container_name: ai-agent-platform-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  redis:
    profiles: ["production"]
    image: redis:7-alpine
    container_name: ai-agent-platform-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  redis_data:

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Cogent — 面向代码、知识库与智能工作流的统一工作台" />
    <meta name="theme-color" content="#19191c" />
    <script>
      (() => { let theme = "system"; try { theme = localStorage.getItem("cogent.appearance") || theme; } catch {} const dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches); document.documentElement.dataset.theme = dark ? "dark" : "light"; document.documentElement.style.colorScheme = dark ? "dark" : "light"; })();
    </script>
    <title>Cogent</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>请启用 JavaScript 以使用 Cogent 工作台。</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

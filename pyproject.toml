[project]
name = "ai-agent-platform"
version = "0.1.0"
description = "A learning project for Python AI backend and game AI agent engineering."
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13.0",
    "chromadb>=0.5.0",
    "celery[redis]>=5.6.0,<6.0.0",
    "cryptography>=45.0.0,<50.0.0",
    "fastapi>=0.115.0",
    "google-genai>=2.14.0,<3.0.0",
    "httpx>=0.28.0",
    "jsonschema>=4.23.0",
    "keyring>=25.0.0,<26.0.0",
    "langgraph>=0.6.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "mcp==2.0.0",
    "pydantic>=2.8.0",
    "psycopg[binary]>=3.2.0",
    "psycopg-pool>=3.2.0",
    "pypdf>=5.0.0",
    "PyYAML>=6.0.0,<7.0.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.18",
    "qdrant-client>=1.16.0,<1.18.0",
    "sentence-transformers>=3.0.0",
    "socksio>=1.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
ai-agent = "ai_agent_platform.cli:main"
ai-agent-platform = "ai_agent_platform.cli:main"
ai-agent-api = "ai_agent_platform.api.entrypoint:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
